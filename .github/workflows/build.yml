name: Compilar APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extrair codigo
        run: |
          mkdir src && tar -xJf SmartVision-src.tar.xz -C src
          for f in SmartVision-update*.tar.xz; do [ -f "$f" ] && tar -xJf "$f" -C src; done
          true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compilar
        working-directory: src
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleFullDebug assembleLiteDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartVision-APK
          path: src/app/build/outputs/apk/*/debug/*.apk
